[package]
name = "agentcontrol"
version = "0.1.0"
description = "多智能体控制器：探测 / 安装 / 配置本机 AI 智能体 CLI 与桌面客户端"
authors = ["AgentControl"]
edition = "2021"

[lib]
name = "agentcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 启用后使用内嵌前端资源（frontendDist）；tauri build 与 `cargo build --release --features custom-protocol` 会自动带上，
# 不启用时走 tauri.conf.json 的 devUrl（开发模式）。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
base64 = "0.23.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
